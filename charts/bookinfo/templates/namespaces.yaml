{{- if .Values.bookInfo.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "bookinfo.appNamespace" . }}
  labels:
    {{- include "bookinfo.labels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.litmus.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "bookinfo.litmusNamespace" . }}
  labels:
    {{- include "bookinfo.labels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "bookinfo.monitoringNamespace" . }}
  labels:
    {{- include "bookinfo.labels" . | nindent 4 }}
{{- end }}
