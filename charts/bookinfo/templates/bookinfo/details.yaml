{{- if .Values.bookInfo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: details
  labels:
    app: details
    service: details
  namespace: {{ include "bookinfo.appNamespace" . }}
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: details
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-details
  labels:
    account: details
  namespace: {{ include "bookinfo.appNamespace" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: details-v1
  namespace: {{ include "bookinfo.appNamespace" . }}
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: details
    version: v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    litmuschaos.io/chaos: "true"
  labels:
    app: details
    version: v1
  name: details-v1
  namespace: {{ include "bookinfo.appNamespace" . }}
spec:
  replicas: {{ .Values.bookInfo.details.replicas }}
  selector:
    matchLabels:
      app: details
      version: v1
  template:
    metadata:
      labels:
        app: details
        version: v1
    spec:
      serviceAccountName: bookinfo-details
      containers:
      - name: details
        image: {{ .Values.bookInfo.details.image }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 9080
{{- end }}
