# Default values for the bookinfo chart.
#
# Source of truth for the application manifests: istio/istio git tag 1.30.2,
# samples/bookinfo/platform/kube/{bookinfo.yaml,bookinfo-versions.yaml}.
# The upstream sample also ships a Gateway API bookinfo-gateway.yaml that
# requires `gatewayClassName: istio` (an Istio-managed Gateway API
# implementation). ACE's cluster stack does not provision Istio/service-mesh
# today (see sock-shop, which is also mesh-free), so productpage is exposed
# the same way sock-shop's front-end is: a plain Kubernetes Service instead
# of an Istio Gateway. This means mesh-dependent ITBench fault types
# (mTLS enforcement, Istio authorization-policy faults, ambient-mode faults)
# are out of scope until Istio is added as a cluster prerequisite.

# Global settings
global:
  imagePullPolicy: IfNotPresent

# Namespace configurations
namespaces:
  bookInfo: book-info
  litmus: litmus
  monitoring: monitoring

# Bookinfo Application Settings
bookInfo:
  enabled: true

  details:
    replicas: 1
    image: registry.istio.io/release/examples-bookinfo-details-v1:1.20.3

  ratings:
    replicas: 1
    image: registry.istio.io/release/examples-bookinfo-ratings-v1:1.20.3

  reviews:
    v1:
      replicas: 1
      image: registry.istio.io/release/examples-bookinfo-reviews-v1:1.20.3
    v2:
      replicas: 1
      image: registry.istio.io/release/examples-bookinfo-reviews-v2:1.20.3
    v3:
      replicas: 1
      image: registry.istio.io/release/examples-bookinfo-reviews-v3:1.20.3

  productpage:
    replicas: 1
    image: registry.istio.io/release/examples-bookinfo-productpage-v1:1.20.3
    service:
      type: LoadBalancer
      port: 9080
      targetPort: 9080
      nodePort: 30002

  # Simple in-cluster load generator against productpage, mirroring ITBench's
  # own load-generator-product-page Deployment (see install_book_info.yaml).
  loadGenerator:
    enabled: true
    replicas: 1
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    intervalSeconds: 5

# LitmusChaos Settings
# Set enabled: false since LitmusChaos is installed separately
litmus:
  enabled: false

  # Chaos Exporter for metrics
  chaosExporter:
    enabled: true
    image: litmuschaos/chaos-exporter:1.13.3
    replicas: 1
    service:
      port: 8080

# Monitoring Settings
# Set enabled: true to deploy Prometheus and Grafana
monitoring:
  enabled: true

  # Prometheus
  prometheus:
    replicas: 1
    image: prom/prometheus:v2.25.0
    retention: 360h
    service:
      type: NodePort
      port: 9090
      nodePort: 31090
    # Route node + cadvisor scrapes through the apiserver proxy. Required on
    # kind/minikube where kubelet TLS cert SANs don't match kube-sd's __address__.
    # On larger clusters set to false to scrape kubelet :10250 directly.
    kubeletProxy: true

  # Grafana
  grafana:
    replicas: 1
    image: grafana/grafana:latest
    service:
      type: NodePort
      port: 3000
      nodePort: 31687

  # metrics-server (kubectl top, MCP pods_top) is a cluster singleton owned by
  # the ACE platform chart (deploy/helm/ace/templates/metrics-server.yaml);
  # application charts must not install it.

  # kube-state-metrics: Pod/Deployment/ReplicaSet state-change time series
  kubeStateMetrics:
    enabled: true
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0

# Chaos Experiments Settings
chaosExperiments:
  enabled: false  # Set to true to deploy chaos experiments

  # Productpage pod-delete experiment
  productpagePodDelete:
    enabled: false
    totalChaosDuration: "30"
    chaosInterval: "10"
    force: "false"

  # Reviews-v2 pod-delete experiment
  reviewsV2PodDelete:
    enabled: false
    totalChaosDuration: "30"
    chaosInterval: "10"
    force: "false"

# MCP Tools Settings
# Tools for Model Context Protocol integration (using public MCP server images)
mcpTools:
  # Kubernetes MCP Server - exposes K8s + Litmus operations via MCP protocol
  kubernetesMcpServer:
    enabled: true
    name: kubernetes-mcp-server
    replicas: 1
    # Pinned to a released version, not :latest: quay.io's :latest tracks unreleased
    # main-branch builds and has twice shipped breaking CLI changes ahead of any
    # release. Bump this tag deliberately after checking upstream's release notes
    # (docs/configuration-changes.md in the kubernetes-mcp-server repo).
    image: quay.io/containers/kubernetes_mcp_server:v0.0.67
    port: 8081
    config:
      listOutput: "yaml"
      stateless: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
        ephemeralStorage: "200Mi"
      limits:
        memory: "256Mi"
        cpu: "500m"
        ephemeralStorage: "500Mi"
    securityContext:
      runAsUser: 65532
      allowPrivilegeEscalation: false
    service:
      type: ClusterIP
      port: 8081
      targetPort: 8081

  # Prometheus MCP Server - exposes Prometheus queries via MCP protocol
  prometheusMcpServer:
    enabled: true
    name: prometheus-mcp-server
    replicas: 1
    image: ghcr.io/pab1it0/prometheus-mcp-server:latest
    port: 9090
    config:
      prometheusUrl: ""  # Auto-resolved to http://prometheus.<monitoring-ns>.svc.cluster.local:9090
      transport: "http"
      bindHost: "0.0.0.0"
      bindPort: "9090"
      requestTimeout: "30"
      sslVerify: "true"
      disableLinks: "false"
    auth:
      placeholder: "unused"
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
        ephemeralStorage: "200Mi"
      limits:
        memory: "256Mi"
        cpu: "500m"
        ephemeralStorage: "500Mi"
    securityContext:
      runAsUser: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    service:
      type: NodePort
      port: 8083
      targetPort: 9090
      nodePort: 31084

# ── Experiment builder settings ──────────────────────────────────────
# The values above that the ACE experiment builder lets a user change when
# this application is added to an experiment. Each key is a path in this file
# and the value found there is the setting's default. No template reads this
# block, so Helm ignores it. The namespace is chosen in the builder itself and
# is not listed here (AgentCert pkg/chartconfig validates this block).
configurations:
  - key: bookInfo.productpage.replicas
    label: Productpage replicas
    type: integer
    min: 1
    max: 5
    group: Replicas
  - key: bookInfo.details.replicas
    label: Details replicas
    type: integer
    min: 1
    max: 5
    group: Replicas
  - key: bookInfo.ratings.replicas
    label: Ratings replicas
    type: integer
    min: 1
    max: 5
    group: Replicas
  - key: bookInfo.reviews.v1.replicas
    label: Reviews v1 replicas
    type: integer
    min: 1
    max: 5
    group: Replicas
  - key: bookInfo.reviews.v2.replicas
    label: Reviews v2 replicas
    type: integer
    min: 1
    max: 5
    group: Replicas
  - key: bookInfo.reviews.v3.replicas
    label: Reviews v3 replicas
    type: integer
    min: 1
    max: 5
    group: Replicas
  - key: bookInfo.loadGenerator.enabled
    label: Load generator
    description: Sends steady traffic to productpage so faults have visible impact.
    type: boolean
    group: Load
  - key: bookInfo.loadGenerator.intervalSeconds
    label: Load interval (seconds)
    description: Pause between load-generator requests.
    type: integer
    min: 1
    max: 60
    group: Load
