{{- if and .Values.chaosExperiments.enabled .Values.chaosExperiments.frontendPodDelete.enabled }}
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: frontend-pod-delete
  namespace: {{ include "ace-otel-demo.litmusNamespace" . }}
spec:
  annotationCheck: 'false'
  engineState: 'active'
  appinfo:
    appns: '{{ include "ace-otel-demo.appNamespace" . }}'
    # Matches the subchart's selectorLabels (opentelemetry.io/name), see
    # templates/_helpers.tpl in the opentelemetry-demo dependency chart.
    applabel: 'opentelemetry.io/name=frontend'
    appkind: 'deployment'
  chaosServiceAccount: litmus-admin
  monitoring: true
  jobCleanUpPolicy: 'retain'
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: '{{ .Values.chaosExperiments.frontendPodDelete.totalChaosDuration }}'
            - name: CHAOS_INTERVAL
              value: '{{ .Values.chaosExperiments.frontendPodDelete.chaosInterval }}'
            - name: FORCE
              value: '{{ .Values.chaosExperiments.frontendPodDelete.force }}'
{{- end }}
